<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFCF3">
  <meta name="color-scheme" content="light">

  <!-- iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jade!">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <title>Jade!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Welcome (shown on every launch, tap to skip) -->
  <div id="welcome" class="welcome" aria-hidden="true">
    <div class="welcome__emoji">🥨</div>
    <h1 class="welcome__title">Welcome<br>to <span class="accent">Jade!</span></h1>
    <p class="welcome__tagline">Jarvis-Approved Daily Excellence</p>
  </div>

  <!-- One-time login (shown until there's a session) -->
  <div id="login" class="login" hidden>
    <form class="login__form" novalidate>
      <div class="welcome__emoji">🥨</div>
      <h1 class="login__title">Log in to <span class="accent">Jade!</span></h1>
      <input class="login__input" name="email" type="email" placeholder="Email"
        autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <input class="login__input" name="password" type="password" placeholder="Password"
        autocomplete="current-password" required>
      <button class="login__button" type="submit">Log in</button>
      <p class="login__error" aria-live="polite"></p>
    </form>
  </div>

  <!-- Screen: Habits -->
  <main id="habits" class="screen app is-active" aria-label="Habits">
    <header class="app__header">
      <div class="logo">Habits</div>
    </header>

    <section class="today" aria-labelledby="today-heading">
      <h2 id="today-heading" class="section-title"></h2>
      <ul id="today-list" class="habit-list"></ul>
      <p id="all-done" class="all-done" hidden>All done 🎉</p>
    </section>

    <section class="week" aria-labelledby="week-heading">
      <h2 id="week-heading" class="section-title">Current Week</h2>
      <div id="week-grid" class="week-grid" role="grid"></div>
      <p id="week-total" class="week-total" hidden></p>
    </section>

    <section class="stats" aria-labelledby="stats-heading">
      <h2 id="stats-heading" class="section-title">Statistics</h2>
      <div class="stats-month">
        <button id="stats-prev" class="stats-month__arrow" type="button" aria-label="Previous month">‹</button>
        <span id="stats-month-name"></span>
        <button id="stats-next" class="stats-month__arrow" type="button" aria-label="Next month">›</button>
        <span id="stats-month-total" class="stats-month__total"></span>
      </div>
      <div id="radar" class="radar">
        <div class="chart-tip" hidden></div>
      </div>

      <div class="weekly">
        <div id="bar-filters" class="bar-filters" role="group" aria-label="Show"></div>
        <div id="bars" class="bars">
          <div class="bars__scroll"></div>
          <div class="bars__goal"><span>75%</span></div>
          <div class="chart-tip" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Screen: To Do List -->
  <main id="todo" class="screen app" aria-label="To Do List">
    <header class="app__header">
      <div class="logo">To Do List</div>
    </header>

    <section class="todo-section" data-list="today" aria-label="Today's tasks">
      <ul class="todo-list"></ul>
      <div class="todo-add" data-label="add a task"></div>
    </section>

    <section class="todo-section" data-list="longterm" aria-labelledby="longterm-heading">
      <h2 id="longterm-heading" class="section-title section-title--left">Long Term Tasks</h2>
      <ul class="todo-list"></ul>
      <div class="todo-add" data-label="add a task"></div>
    </section>

    <section class="todo-section todo-section--card" data-list="goals" aria-labelledby="goals-heading">
      <h2 id="goals-heading" class="section-title section-title--left">Goals</h2>
      <ul class="todo-list"></ul>
      <div class="todo-add" data-label="add a goal"></div>
    </section>
  </main>

  <!-- Screen: Trackers -->
  <main id="trackers" class="screen app" aria-label="Trackers">
    <header class="app__header">
      <div class="logo">Trackers</div>
    </header>

    <section class="tracker tracker--sleep" aria-labelledby="sleep-heading">
      <h2 id="sleep-heading" class="tracker__name">sleep</h2>
      <div class="tracker__month">
        <button class="tracker__arrow" type="button" data-step="-1" aria-label="Previous month">‹</button>
        <span class="tracker__month-name section-title"></span>
        <button class="tracker__arrow" type="button" data-step="1" aria-label="Next month">›</button>
      </div>
      <p class="sleep-summary"><span id="sleep-last"></span><span id="sleep-avg"></span></p>

      <div class="sleep-chart">
        <div class="sleep-chart__hours" aria-hidden="true"></div>
        <div class="sleep-chart__scroll">
          <div class="sleep-chart__track"></div>
        </div>
      </div>

      <p class="tracker__label"></p>
      <div class="tracker-card sleep-card">
        <div class="sleep-card__form">
          <div class="sleep-card__fields">
            <label class="sleep-field">
              <span class="sleep-field__name">Bedtime</span>
              <span class="sleep-field__value" data-for="bed"></span>
              <input class="sleep-field__input" type="time" name="bed" required>
            </label>
            <label class="sleep-field">
              <span class="sleep-field__name">Wake up</span>
              <span class="sleep-field__value" data-for="wake"></span>
              <input class="sleep-field__input" type="time" name="wake" required>
            </label>
          </div>
        </div>
        <p class="tracker-done">Done!</p>
      </div>
      <div class="sleep-actions">
        <button class="tracker-save" type="button">save</button>
        <p class="sleep-card__error" aria-live="polite"></p>
      </div>
    </section>

    <section class="tracker tracker--mood" aria-labelledby="mood-heading">
      <h2 id="mood-heading" class="tracker__name">mood</h2>
      <div class="tracker__month">
        <button class="tracker__arrow" type="button" data-step="-1" aria-label="Previous month">‹</button>
        <span class="tracker__month-name section-title"></span>
        <button class="tracker__arrow" type="button" data-step="1" aria-label="Next month">›</button>
      </div>
      <div class="mood-grid"></div>

      <p class="tracker__label"></p>
      <div class="tracker-card mood-card">
        <div class="mood-chips" role="group" aria-label="Mood"></div>
        <p class="tracker-done">Done!</p>
      </div>
    </section>
  </main>

  <!-- Bottom tab toggle -->
  <nav class="tabbar" aria-label="Screens">
    <button class="tab is-active" type="button" data-screen="habits" aria-pressed="true"><span class="tab__pill">Habits</span></button>
    <button class="tab" type="button" data-screen="todo" aria-pressed="false"><span class="tab__pill">To do list</span></button>
    <button class="tab" type="button" data-screen="trackers" aria-pressed="false"><span class="tab__pill">Trackers</span></button>
  </nav>

  <script src="stats.js"></script>
  <script src="trackers.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
